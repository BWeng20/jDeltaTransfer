plugins {
    id 'java'
}

group = 'com.bw.jdt'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.commons:commons-compress:1.28.0'
    implementation 'org.tukaani:xz:1.10'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs << '-Xlint:-this-escape'
}

test {
    useJUnitPlatform()
    testLogging { events 'passed', 'failed', 'skipped'; showStandardStreams = true }
    maxHeapSize = '2g'
    // Opt-in benchmarks stay off unless asked for: gradlew test -Pbench
    systemProperty 'jdt.bench', project.hasProperty('bench') ? 'true' : 'false'
}

jar {
    manifest { attributes 'Main-Class': 'com.bw.jdt.Main' }
}

// Fat jar so server/client can be started standalone.
tasks.register('fatJar', Jar) {
    archiveClassifier = 'all'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest { attributes 'Main-Class': 'com.bw.jdt.Main' }
    from sourceSets.main.output
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } } {
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'module-info.class'
    }
}

tasks.register('runServer', JavaExec) {
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.bw.jdt.server.ServerMain'
    jvmArgs = ['-Xmx4g']
    if (project.hasProperty('args')) args(project.property('args').toString().split(/\s+/))
}

tasks.register('runClient', JavaExec) {
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.bw.jdt.client.ClientMain'
    jvmArgs = ['-Xmx4g']
    if (project.hasProperty('args')) args(project.property('args').toString().split(/\s+/))
}

tasks.register('runGen', JavaExec) {
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.bw.jdt.tools.GenerateTestArchives'
    jvmArgs = ['-Xmx4g']
    if (project.hasProperty('args')) args(project.property('args').toString().split(/\s+/))
}
